<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA学校数据检索系统</title>
<style>
  :root{
    --primary:#1e40af; --primary2:#0ea5e9; --accent:#0ea5e9;
    --bg:#eef2f7; --panel:#fff; --border:#e2e8f0; --line:#eef1f5;
    --text:#0f172a; --muted:#64748b; --rowalt:#f8fafc;
    --green:#16a34a; --yellow:#d97706; --red:#dc2626;
    --lv1:#2563eb; --lv2:#3b82f6; --lv3:#60a5fa; --lv4:#94a3b8; --lv5:#a855f7; --lv6:#d97706; --lv7:#cbd5e1;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px 60px;}

  /* 顶部品牌栏 */
  .topbar{background:linear-gradient(110deg,var(--primary) 0%,#1d4ed8 45%,var(--primary2) 100%);
          color:#fff;padding:18px 22px;box-shadow:0 4px 18px rgba(30,64,175,.22);position:sticky;top:0;z-index:50;}
  .topbar-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);
        display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;letter-spacing:.5px;
        border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(2px);}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:1px;}
  .brand .sub{font-size:12.5px;opacity:.85;margin-top:3px;}
  .nav{margin-left:auto;display:flex;gap:8px;background:rgba(255,255,255,.14);padding:5px;border-radius:11px;}
  .nav-btn{border:none;background:transparent;color:#fff;padding:9px 18px;font-size:14px;font-weight:600;
           border-radius:8px;cursor:pointer;transition:all .15s;opacity:.85;}
  .nav-btn:hover{opacity:1;}
  .nav-btn.active{background:#fff;color:var(--primary);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.12);}

  /* 工具栏 */
  .toolbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:20px 0 14px;}
  .toolbar .group{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
                  border-radius:12px;padding:10px 14px;box-shadow:0 1px 4px rgba(15,23,42,.04);}
  .group .lbl{font-size:13px;color:var(--muted);font-weight:600;}
  .issue-btn{border:1px solid var(--border);background:#fff;color:#334155;padding:8px 16px;font-size:14px;
             font-weight:600;border-radius:9px;cursor:pointer;transition:all .14s;}
  .issue-btn:hover{border-color:var(--primary2);color:var(--primary);}
  .issue-btn.active{background:linear-gradient(110deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;
                    box-shadow:0 3px 10px rgba(14,165,233,.35);}
  .issue-meta{font-size:13px;color:var(--muted);}
  .issue-meta b{color:var(--primary);}

  /* 卡片 */
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(15,23,42,.05);
        padding:18px 20px;margin-bottom:18px;}
  .card-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .card-title .bar{width:4px;height:16px;background:var(--primary2);border-radius:3px;display:inline-block;}

  /* 图例 */
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .legend b{font-weight:700;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle;}

  /* 搜索 + 省份条 */
  .search-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .search-box{position:relative;flex:1;min-width:240px;}
  .search-box .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted);}
  .search-input{width:100%;padding:11px 14px 11px 40px;font-size:15px;border:1px solid var(--border);border-radius:10px;
                outline:none;background:#fff;transition:border-color .15s;}
  .search-input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(14,165,233,.12);}
  .prov-bar{display:flex;gap:8px;flex-wrap:wrap;}
  .prov-btn{padding:7px 14px;border:1px solid var(--border);border-radius:18px;background:#fff;font-size:13.5px;
            cursor:pointer;color:#334155;transition:all .13s;font-weight:500;}
  .prov-btn:hover{border-color:var(--primary2);color:var(--primary);}
  .prov-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* 年级 tab */
  .tabs{display:flex;gap:10px;margin-bottom:14px;}
  .tab-btn{border:none;padding:10px 22px;font-size:14px;font-weight:600;border-radius:10px;cursor:pointer;color:#fff;
           transition:filter .15s;background:#cbd5e1;}
  .tab-btn[data-tab="g1"]{background:var(--lv1);}
  .tab-btn[data-tab="g2"]{background:var(--lv2);}
  .tab-btn[data-tab="g3"]{background:#0891b2;}
  .tab-btn.active{box-shadow:0 0 0 3px rgba(14,165,233,.25);filter:brightness(1.06);}
  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* 树 */
  .tree{border-radius:10px;overflow:hidden;border:1px solid var(--border);}
  .province{border-bottom:1px solid var(--border);}
  .province:last-child{border-bottom:none;}
  .province-head{display:flex;align-items:center;gap:10px;padding:13px 18px;background:#f1f5fb;cursor:pointer;
                 font-weight:700;font-size:15.5px;user-select:none;transition:background .12s;}
  .province-head:hover{background:#e7eefb;}
  .province-head .arrow{display:inline-block;width:14px;text-align:center;transition:transform .2s;color:var(--muted);}
  .province-head.collapsed .arrow{transform:rotate(-90deg);}
  .province-head .pcount{margin-left:auto;font-size:12px;font-weight:600;color:var(--primary);background:#fff;
                         border:1px solid #dbeafe;border-radius:20px;padding:3px 12px;}
  .province-body{display:block;}
  .province-head.collapsed+.province-body{display:none;}
  .city{padding-left:26px;border-top:1px solid var(--line);}
  .city-head{display:flex;align-items:center;gap:8px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:14.5px;
             color:#334155;user-select:none;}
  .city-head .arrow{display:inline-block;width:12px;text-align:center;transition:transform .2s;color:var(--muted);font-size:12px;}
  .city-head.collapsed .arrow{transform:rotate(-90deg);}
  .city-head .ccount{margin-left:auto;font-size:11.5px;color:var(--muted);background:#f1f5f9;border-radius:8px;padding:2px 9px;}
  .city-body{display:block;}
  .city-head.collapsed+.city-body{display:none;}
  .county{padding-left:22px;}
  .county-row{display:flex;align-items:baseline;gap:10px;padding:6px 18px;font-size:14px;border-top:1px solid #f5f7fa;}
  .county-name{font-weight:700;color:#475569;min-width:96px;flex-shrink:0;}
  .school-list{color:#222;line-height:2;}
  .school-tag{display:inline-flex;align-items:center;gap:5px;background:var(--rowalt);border:1px solid var(--border);
              border-radius:6px;padding:4px 11px;margin:3px 5px 3px 0;font-size:13.5px;white-space:nowrap;cursor:pointer;
              transition:all .12s;}
  .school-tag:hover{background:#e6eefb;border-color:var(--primary2);transform:translateY(-1px);box-shadow:0 2px 6px rgba(14,165,233,.18);}
  .lv{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;color:#fff;font-weight:600;}
  .rtag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;color:#fff;font-weight:700;background:#e11d48;margin-left:3px;}

  .unknown-section{margin-top:16px;border:1px solid #f0d8b8;border-radius:12px;overflow:hidden;background:#fffdf9;}
  .unknown-head{padding:13px 18px;background:#fef3e7;font-weight:700;font-size:14.5px;color:#b45309;cursor:pointer;
                display:flex;align-items:center;gap:8px;}
  .unknown-head .arrow{transition:transform .2s;}
  .unknown-head.collapsed .arrow{transform:rotate(-90deg);}
  .unknown-body{padding:12px 18px;}
  .unknown-head.collapsed+.unknown-body{display:none;}
  .unknown-body .school-tag{background:#fff8ef;border-color:#f0d8b8;}

  .note{margin-top:18px;padding:14px 18px;background:#fff;border-left:4px solid var(--primary2);border-radius:0 8px 8px 0;
        font-size:12.5px;color:#556;line-height:1.8;}

  /* 弹窗 */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;
                 z-index:100;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:22px;max-height:86vh;overflow-y:auto;
         box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 6px;font-size:20px;color:var(--primary);word-break:break-all;}
  .modal .badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:11px;margin:0 5px 10px 0;color:#fff;font-weight:600;}
  .modal .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px;}
  .modal .row .k{color:var(--muted);min-width:80px;flex-shrink:0;font-weight:600;}
  .modal .row .v{color:#1e293b;flex:1;word-break:break-all;line-height:1.65;}
  .modal .close{margin-top:16px;width:100%;padding:12px;background:linear-gradient(110deg,var(--primary),var(--primary2));
                color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}

  /* 仪表盘 */
  .dash-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  .bar-row{display:flex;align-items:center;gap:14px;padding:7px 0;}
  .bar-name{width:120px;flex-shrink:0;font-size:13.5px;font-weight:600;color:#334155;text-align:right;}
  .bar-track{flex:1;background:#f1f5f9;border-radius:8px;height:26px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:8px;
            transition:width .5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;}
  .bar-val{color:#fff;font-size:12.5px;font-weight:700;}
  .bar-row.unknown .bar-name{color:#b45309;}
  .bar-row.unknown .bar-fill{background:linear-gradient(90deg,#f59e0b,#fbbf24);}

  table.cmp{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.cmp th,table.cmp td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);}
  table.cmp thead th{background:#f1f5fb;color:#334155;font-weight:700;position:sticky;top:0;}
  table.cmp tbody td:first-child{text-align:left;font-weight:600;color:#334155;background:#fafcff;}
  table.cmp td.cell{border-radius:0;}
  .cmp-tip{font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.7;}
  .hidden{display:none !important;}
  .section-sub{font-size:13px;color:var(--muted);margin:-6px 0 14px;}
.deploy-status{position:fixed;top:96px;right:14px;z-index:100;background:rgba(255,255,255,.96);
  border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 20px rgba(15,23,42,.12);
  padding:10px 13px;width:230px;font-size:12px;color:var(--text);backdrop-filter:blur(4px);}
.deploy-status .t-row{display:flex;justify-content:space-between;align-items:baseline;margin:3px 0;}
.deploy-status .t-label{color:var(--muted);font-size:11px;}
.deploy-status .t-val{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;letter-spacing:.5px;}
.deploy-status .tag{display:block;margin-top:8px;padding:5px 10px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:#fff;text-align:center;}
.deploy-status .tag.green{background:var(--green);}
.deploy-status .tag.yellow{background:var(--yellow);}
.deploy-status .tag.red{background:var(--red);}
.deploy-status .hint{margin-top:6px;font-size:10.5px;color:var(--muted);line-height:1.45;}
</style>
</head>
<body>

<div class="deploy-status" id="deployStatus">
  <div class="t-row"><span class="t-label">UTC 时间</span><span class="t-val" id="utcTime">--:--:--</span></div>
  <div class="t-row"><span class="t-label">北京时间</span><span class="t-val" id="bjTime">--:--:--</span></div>
  <span class="tag" id="chStatus">检测中</span>
  <div class="hint" id="chHint"></div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">CPA</div>
    <div class="brand">
      <h1>CPA学校数据检索系统</h1>
      <div class="sub">生源学校 · 地区 / 等级 / 升学检索 · 按周次（每周周四）归档</div>
    </div>
    <div class="nav">
      <button class="nav-btn active" data-view="search">检索系统</button>
      <button class="nav-btn" data-view="dash">仪表盘</button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- 工具栏：期次 -->
  <div class="toolbar">
    <div class="group">
      <span class="lbl">期次</span>
      <div id="issueBtns" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>
    <div class="issue-meta" id="issueMeta"></div>
  </div>

  <!-- 检索视图 -->
  <section id="view-search">
    <div class="card">
      <div class="card-title"><span class="bar"></span>检索与浏览</div>
      <div class="section-sub">顶部可<strong>搜索校名</strong>，或点<strong>省份快捷条</strong>只看该省；点任意校名弹窗看完整详情（等级 / 本科率 / 分班）。数据按「期次」隔离，互不交叉。</div>
      <div class="legend">
        <span><span class="dot" style="background:var(--green)"></span><b>公开</b> 有公开升学数据</span>
        <span><span class="dot" style="background:var(--yellow)"></span><b>估测</b> 县级未公开，按层级给区间</span>
        <span><span class="dot" style="background:var(--red)"></span><b>待核实</b> 校名/地区存疑</span>
      </div>
      <div class="search-row">
        <div class="search-box"><span class="ic">🔍</span>
          <input class="search-input" id="searchBox" placeholder="搜索校名，如：平凉一中 / 华山中学" />
        </div>
      </div>
      <div class="prov-bar" id="provBar"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="g1">新高一</button>
        <button class="tab-btn" data-tab="g2">新高二</button>
        <button class="tab-btn" data-tab="g3">新高三</button>
      </div>
      <div class="tab-content active" id="g1"></div>
      <div class="tab-content" id="g2"></div>
      <div class="tab-content" id="g3"></div>
    </div>

    <div class="note" id="dataNote"></div>
  </section>

  <!-- 仪表盘视图 -->
  <section id="view-dash" class="hidden">
    <div class="card">
      <div class="card-title"><span class="bar"></span>当期各省学校分布</div>
      <div class="section-sub" id="dashSub"></div>
      <div id="dashBars"></div>
    </div>

    <div class="card">
      <div class="card-title"><span class="bar"></span>各期次 × 省份 对比矩阵</div>
      <div class="cmp-tip">行=省份，列=期次，单元格=该期该省学校数。<span style="color:var(--primary);font-weight:600">底色越深表示数量越多</span>，便于后期横向对比各期生源结构变化。</div>
      <div style="overflow-x:auto;"><table class="cmp" id="cmpTable"></table></div>
    </div>
  </section>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="m-name"></h3>
    <div id="m-body"></div>
    <button class="close" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
const ISSUES = {
"0813": {
  "name": "0813期",
  "date": "2026-08-13",
  "desc": "首期生源学校核实数据（按截图名单逐所核验）",
  "data": [
    {"name":"施甸一中学校","province":"云南","city":"保山","district":"施甸","level":"省示范高中","nature":"公办","grades":"新高一","rates":"未公开精确本科率。层级有依据：1995年认定为云南省二级一等完全中学，2022年12月晋升为云南省一级三等高（完）中（公开）。未检索到官方公布的年度本科率/一本率。知名校友：神舟十六号航天员桂海潮（公开）。估测本科率约60%-80%（估测）","classes":"未公开具体班型，通常设重点班与平行班。公开办学规模：76个教学班，其中高中52个班2512人、初中24个班1083人，在校生3595人","confidence":"估测","note":"官方全称“施甸县第一完全中学”（施甸县教育体育局《义务教育学校名录（初中阶段）》列为“完全中学”，县级教育部门举办），俗称施甸一中。原址为道光三十年（1850）重建的施甸义学馆，1940年正式建校。2022年2月搬迁至甸阳镇沙坝脚社区龙泉路1号新校区，用地480亩，按云南省一级一等高完中标准建设。地区与给定一致。","stage":"完全"},

const ISSUE_KEYS = Object.keys(ISSUES);
const LV_COLOR = {"省示范高中":"var(--lv1)","市示范高中":"var(--lv2)","县重点高中":"var(--lv3)",
  "普通高中":"var(--lv4)","民办高中":"var(--lv5)","职业中学":"var(--lv6)","待核实":"var(--lv7)"};

let state = { issue: ISSUE_KEYS[0], view: "search", grade: "g1", kw: "", prov: "" };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dataOf(issue){ return (ISSUES[issue] && ISSUES[issue].data) || []; }
function GRADE_OF(g){ return g==='g1'?'新高一':g==='g2'?'新高二':'新高三'; }

function itemsFor(issue, grade){
  const res=[]; const data=dataOf(issue);
  for(let i=0;i<data.length;i++){ if(data[i].grades && data[i].grades.indexOf(grade)>=0) res.push({i,r:data[i]}); }
  return res;
}

/* ---------- 期次按钮 ---------- */
function renderIssueBtns(){
  const box=document.getElementById('issueBtns'); box.innerHTML='';
  ISSUE_KEYS.forEach(k=>{
    const b=document.createElement('button');
    b.className='issue-btn'+(k===state.issue?' active':'');
    b.textContent=ISSUES[k].name; b.dataset.issue=k;
    b.onclick=()=>{ state.issue=k; state.kw=''; state.prov=''; renderAll(); };
    box.appendChild(b);
  });
  const meta=document.getElementById('issueMeta');
  const cur=ISSUES[state.issue];
  meta.innerHTML='当前：<b>'+esc(cur.name)+'</b> · 归档 '+esc(cur.date)+' · 共 <b>'+cur.data.length+'</b> 所';
}

/* ---------- 检索树 ---------- */
function countProv(o){let n=0;for(const c in o)n+=countCity(o[c]);return n;}
function countCity(o){let n=0;for(const d in o)n+=o[d].length;return n;}

function renderGrade(container, grade){
  const items=itemsFor(state.issue, grade);
  const provMap={}; const unknown=[];
  for(const {i,r} of items){
    if(!r.province || r.province==='待核实'){ unknown.push({i,r}); continue; }
    provMap[r.province]=provMap[r.province]||{};
    provMap[r.province][r.city]=provMap[r.province][r.city]||{};
    provMap[r.province][r.city][r.district]=provMap[r.province][r.city][r.district]||[];
    provMap[r.province][r.city][r.district].push({i,r});
  }
  const provs=Object.keys(provMap);
  let bar='<div class="prov-bar" id="bar-'+container.id+'"><button class="prov-btn'+(state.prov===''?' active':'')+'" data-prov="">全部</button>';
  for(const p of provs) bar+='<button class="prov-btn'+(state.prov===p?' active':'')+'" data-prov="'+esc(p)+'">'+esc(p)+'</button>';
  bar+='</div>';

  let html='<div class="tree">';
  provs.sort((a,b)=>countProv(provMap[b])-countProv(provMap[a]));
  for(const prov of provs){
    const cities=provMap[prov]; const pCount=countProv(cities);
    html+='<div class="province" data-prov="'+esc(prov)+'"><div class="province-head" onclick="this.classList.toggle(\'collapsed\')"><span class="arrow">▼</span>'+esc(prov)+'<span class="pcount">'+pCount+' 所</span></div><div class="province-body">';
    const cityKeys=Object.keys(cities).sort((a,b)=>countCity(cities[b])-countCity(cities[a]));
    for(const city of cityKeys){
      const counties=cities[city]; const cCount=countCity(counties);
      html+='<div class="city"><div class="city-head" onclick="this.classList.toggle(\'collapsed\')"><span class="arrow">▼</span>'+esc(city)+'<span class="ccount">'+cCount+'</span></div><div class="city-body">';
      for(const county in counties){
        const list=counties[county];
        html+='<div class="county"><div class="county-row"><span class="county-name">'+esc(county)+'</span><span class="school-list">';
        for(const {i,r} of list){
          const lv=r.level||''; const col=LV_COLOR[lv]||'var(--lv4)';
          html+='<span class="school-tag" onclick="openModal('+i+')">'+esc(r.name)+(lv?'<span class="lv" style="background:'+col+'">'+esc(lv)+'</span>':'')+(r.stage&&r.stage!=='待定'?' <span style="font-size:10px;color:#0ea5e9;margin-left:2px;font-weight:600">'+esc(r.stage)+'</span>':'')+(r.tag?'<span class="rtag">'+esc(r.tag)+'</span>':'')+'</span>';
        }
        html+='</span></div></div>';
      }
      html+='</div></div>';
    }
    html+='</div></div>';
  }
  html+='</div>';

  if(unknown.length){
    html+='<div class="unknown-section"><div class="unknown-head" onclick="this.classList.toggle(\'collapsed\')"><span class="arrow">▼</span>未明确归类（'+unknown.length+' 所，需核对原图）</div><div class="unknown-body">';
    for(const {i,r} of unknown) html+='<span class="school-tag" onclick="openModal('+i+')">'+esc(r.name)+'</span>';
    html+='</div></div>';
  }
  container.innerHTML=bar+html;

  container.querySelectorAll('.prov-btn').forEach(btn=>{
    btn.onclick=()=>{
      container.querySelectorAll('.prov-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); state.prov=btn.dataset.prov; applyFilter(container);
    };
  });
}

function applyFilter(container){
  const kw=state.kw||''; const pf=state.prov||'';
  container.querySelectorAll('.province').forEach(provEl=>{
    const provName=provEl.dataset.prov; const provMatch=!pf||provName===pf; let anyVisible=false;
    provEl.querySelectorAll('.county').forEach(countyEl=>{
      let cv=false;
      countyEl.querySelectorAll('.school-tag').forEach(tag=>{
        const mk=!kw||tag.textContent.toLowerCase().indexOf(kw.toLowerCase())>=0;
        tag.style.display=mk?'':'none'; if(mk){cv=true;anyVisible=true;}
      });
      countyEl.style.display=cv?'':'none';
    });
    provEl.querySelectorAll('.city').forEach(cityEl=>{
      let vis=false; cityEl.querySelectorAll('.county').forEach(c=>{if(c.style.display!=='none')vis=true;});
      cityEl.style.display=vis?'':'none';
    });
    if(kw) provEl.querySelectorAll('.province-head,.city-head').forEach(h=>h.classList.remove('collapsed'));
    provEl.style.display=(provMatch&&(anyVisible||!kw))?'':'none';
  });
  const unk=container.querySelector('.unknown-section');
  if(unk){ let anyU=false;
    unk.querySelectorAll('.school-tag').forEach(tag=>{
      const mk=!kw||tag.textContent.toLowerCase().indexOf(kw.toLowerCase())>=0;
      tag.style.display=mk?'':'none'; if(mk)anyU=true;
    }); unk.style.display=anyU?'':'none';
  }
}

function openModal(idx){
  const r=dataOf(state.issue)[idx]; if(!r)return;
  const conf=r.confidence||'待核实';
  const confColor=conf==='公开'?'var(--green)':conf==='估测'?'var(--yellow)':'var(--red)';
  const lv=r.level||'—'; const lvCol=LV_COLOR[lv]||'var(--lv4)';
  let html='';
  html+='<span class="badge" style="background:'+confColor+'">'+esc(conf)+'</span>';
  html+='<span class="badge" style="background:'+lvCol+'">'+esc(lv)+'</span>';
  if(r.stage&&r.stage!=='待定') html+='<span class="badge" style="background:#0ea5e9">'+esc(r.stage)+'</span>';
  html+='<span class="badge" style="background:#64748b">'+esc(r.nature||'—')+'</span>';
  if(r.tag) html+='<span class="badge" style="background:#e11d48">'+esc(r.tag)+'</span>';
  const rows=[['省份',r.province||'—'],['城市',r.city||'—'],['区县',r.district||'—'],
    ['学段',r.stage||'—'],['来源年级',r.grades||'—'],['升学概况',r.rates||'—'],['分班与生源',r.classes||'—']];
  for(const [k,v] of rows) html+='<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>';
  if(r.note) html+='<div class="row"><span class="k">备注</span><span class="v" style="color:#b45309">'+esc(r.note)+'</span></div>';
  document.getElementById('m-name').textContent=r.name||'';
  document.getElementById('m-body').innerHTML=html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

/* ---------- 仪表盘 ---------- */
function renderDash(){
  const data=dataOf(state.issue);
  const sub=document.getElementById('dashSub');
  const cnt={}; let total=0;
  for(const r of data){ const p=r.province||'待核实'; cnt[p]=(cnt[p]||0)+1; total++; }
  const known=Object.keys(cnt).filter(p=>p!=='待核实').sort((a,b)=>cnt[b]-cnt[a]);
  const max=Math.max(1,...known.map(p=>cnt[p]));
  let html='';
  if(known.length){
    for(const p of known){
      const w=Math.round(cnt[p]/max*100);
      html+='<div class="bar-row"><div class="bar-name">'+esc(p)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%"><span class="bar-val">'+cnt[p]+'</span></div></div></div>';
    }
  }
  if(cnt['待核实']){
    const w=Math.round(cnt['待核实']/max*100);
    html+='<div class="bar-row unknown"><div class="bar-name">待核实</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(w,12)+'%"><span class="bar-val">'+cnt['待核实']+'</span></div></div></div>';
  }
  document.getElementById('dashBars').innerHTML=html;
  sub.innerHTML='<b>'+esc(ISSUES[state.issue].name)+'</b> 共 '+total+' 所 · 覆盖 '+known.length+' 个省/自治区/直辖市'+(cnt['待核实']?(' + '+cnt['待核实']+' 所待核实'):'');

  // 对比矩阵
  const allProvs=new Set();
  ISSUE_KEYS.forEach(k=>{ for(const r of dataOf(k)) allProvs.add(r.province||'待核实'); });
  const provs=Array.from(allProvs).filter(p=>p!=='待核实').sort((a,b)=>{
    const ca=ISSUE_KEYS.reduce((s,k)=>s+dataOf(k).filter(r=>r.province===a).length,0);
    const cb=ISSUE_KEYS.reduce((s,k)=>s+dataOf(k).filter(r=>r.province===b).length,0);
    return cb-ca;
  });
  if(cnt['待核实']) provs.push('待核实');
  let t='<thead><tr><th>省份 \\ 期次</th>';
  ISSUE_KEYS.forEach(k=>{ t+='<th>'+esc(ISSUES[k].name)+'</th>'; });
  t+='<th>合计</th></tr></thead><tbody>';
  provs.forEach(p=>{
    t+='<tr><td>'+esc(p)+'</td>';
    let rowSum=0;
    ISSUE_KEYS.forEach(k=>{ const n=dataOf(k).filter(r=>r.province===p).length; rowSum+=n; t+='<td class="cell" data-n="'+n+'">'+(n||'·')+'</td>'; });
    t+='<td><b>'+rowSum+'</b></td></tr>';
  });
  t+='</tbody>';
  const tbl=document.getElementById('cmpTable'); tbl.innerHTML=t;
  // 热力着色（按整表最大值归一化）
  let gmax=1; tbl.querySelectorAll('td.cell').forEach(td=>{ const n=parseInt(td.dataset.n)||0; if(n>gmax)gmax=n; });
  tbl.querySelectorAll('td.cell').forEach(td=>{
    const n=parseInt(td.dataset.n)||0; if(n>0){ const a=0.12+0.55*(n/gmax); td.style.background='rgba(14,165,233,'+a.toFixed(2)+')'; td.style.color='#0f172a'; td.style.fontWeight='600'; }
  });
}

/* ---------- 总渲染 ---------- */
function renderSearch(){
  ['g1','g2','g3'].forEach(g=>{ renderGrade(document.getElementById(g), GRADE_OF(g)); });
  // 应用当前过滤
  const c=document.getElementById(state.grade); applyFilter(c);
  const c1=itemsFor(state.issue,'新高一').length,c2=itemsFor(state.issue,'新高二').length,c3=itemsFor(state.issue,'新高三').length;
  document.getElementById('dataNote').innerHTML=
    '<b>数据说明：</b>本系统为「'+esc(ISSUES[state.issue].name)+'」归档数据，共 <b>'+dataOf(state.issue).length+'</b> 所，含学校等级、办学性质、本科率/一本率、分班与生源、数据可信度。'
    +'年级分布：新高一 '+c1+' 所 · 新高二 '+c2+' 所 · 新高三 '+c3+' 所。'
    +'县级中学官方极少公布精确本科率，未公开者按学校层级给<strong>估测区间</strong>并标注"估测"，绝不捏造；校名或地区存疑者标"待核实"。招生咨询请以学校官方发布为准。';
}
function renderAll(){
  renderIssueBtns();
  renderSearch();
  renderDash();
  // 视图切换
  document.getElementById('view-search').classList.toggle('hidden', state.view!=='search');
  document.getElementById('view-dash').classList.toggle('hidden', state.view!=='dash');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
}

/* 事件 */
document.getElementById('searchBox').addEventListener('input',e=>{ state.kw=e.target.value; applyFilter(document.getElementById(state.grade)); });
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('active'); state.grade=btn.dataset.tab;
    document.getElementById(state.grade).classList.add('active');
    applyFilter(document.getElementById(state.grade));
  };
});
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick=()=>{ state.view=btn.dataset.view; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); };
});

renderAll();

/* 部署通道状态实时提示（GitHub Pages 负载时段） */
function updateClock(){
  const now=new Date();
  const p=n=>String(n).padStart(2,'0');
  document.getElementById('utcTime').textContent=p(now.getUTCHours())+':'+p(now.getUTCMinutes())+':'+p(now.getUTCSeconds());
  const bj=new Date(now.getTime()+8*3600*1000);
  document.getElementById('bjTime').textContent=p(bj.getUTCHours())+':'+p(bj.getUTCMinutes())+':'+p(bj.getUTCSeconds());
  const day=now.getUTCDay(); // 0=Sun..6=Sat
  const isWeekday=(day>=1&&day<=5);
  const h=now.getUTCHours();
  let cls,text,hint;
  if(isWeekday && h>=8 && h<18){
    if(h>=12 && h<14){cls='red';text='通道延迟';hint='UTC 12:00–14:00 亚欧美负载重叠最重，部署易排队十几分钟，请耐心等待或错峰重试';}
    else {cls='yellow';text='通道拥堵';hint='工作日 UTC 08:00–18:00 高负载窗口，构建可能排队数分钟';}
  } else {
    cls='green';text='通道顺畅';hint='当前非高负载时段，部署通常 1–3 分钟生效';
  }
  const tag=document.getElementById('chStatus');
  tag.className='tag '+cls; tag.textContent=text;
  document.getElementById('chHint').textContent=hint;
}
updateClock();
setInterval(updateClock,1000);
</script>
</body>
